<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Kamera Presensi SIAL</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.15);
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    video {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      background: #111827;
      border-radius: 14px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #startCamera {
      background: #2563eb;
      color: white;
    }

    #capture {
      background: #16a34a;
      color: white;
    }

    #closeCamera {
      background: #dc2626;
      color: white;
    }

    #status {
      text-align: center;
      margin: 12px 0;
      font-size: 14px;
    }

    canvas {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>📷 Kamera Presensi</h2>

  <video
    id="video"
    autoplay
    playsinline
  ></video>

  <div id="status">
    Tekan tombol untuk mengaktifkan kamera.
  </div>

  <button id="startCamera">
    📷 Aktifkan Kamera
  </button>

  <button id="capture">
    📸 Ambil Foto
  </button>

  <button id="closeCamera">
    Tutup Kamera
  </button>

  <canvas id="canvas"></canvas>

</div>

<script>

let stream = null;

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');

const statusText =
  document.getElementById('status');

const startButton =
  document.getElementById('startCamera');

const captureButton =
  document.getElementById('capture');

const closeButton =
  document.getElementById('closeCamera');


/* =====================================================
   AKTIFKAN KAMERA
   ===================================================== */

async function startCamera() {

  try {

    statusText.textContent =
      'Meminta izin kamera...';

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

      throw new Error(
        'Browser tidak mendukung akses kamera.'
      );
    }

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: 'user'
          }
        },

        audio: false

      });

    video.srcObject = stream;

    statusText.textContent =
      'Kamera aktif. Silakan ambil foto.';

  } catch (error) {

    console.error(error);

    statusText.textContent =
      'Kamera tidak dapat digunakan: ' +
      error.name +
      ' - ' +
      error.message;

  }

}


/* =====================================================
   AMBIL FOTO
   ===================================================== */

function capturePhoto() {

  if (!stream) {

    alert(
      'Aktifkan kamera terlebih dahulu.'
    );

    return;
  }

  const width =
    video.videoWidth;

  const height =
    video.videoHeight;

  canvas.width = width;
  canvas.height = height;

  const context =
    canvas.getContext('2d');

  context.drawImage(
    video,
    0,
    0,
    width,
    height
  );

  const imageData =
    canvas.toDataURL(
      'image/jpeg',
      0.85
    );

  console.log(imageData);

  alert(
    'Foto berhasil diambil.'
  );

}


/* =====================================================
   TUTUP KAMERA
   ===================================================== */

function closeCamera() {

  if (stream) {

    stream
      .getTracks()
      .forEach(track => track.stop());

    stream = null;

  }

  video.srcObject = null;

  statusText.textContent =
    'Kamera telah ditutup.';

}


/* =====================================================
   EVENT
   ===================================================== */

startButton.addEventListener(
  'click',
  startCamera
);

captureButton.addEventListener(
  'click',
  capturePhoto
);

closeButton.addEventListener(
  'click',
  closeCamera
);

</script>

</body>
</html>
