<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SIAL-absenSI digitAL - Kamera</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
    .card{width:100%;max-width:520px;background:#111827;border:1px solid #334155;border-radius:18px;padding:16px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
    h1{font-size:20px;margin:0 0 5px;text-align:center}
    p{font-size:13px;color:#cbd5e1;text-align:center;margin:0 0 14px}
    .video-wrap{position:relative;width:100%;aspect-ratio:3/4;background:#020617;border-radius:14px;overflow:hidden;border:2px solid #334155}
    video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
    .frame{position:absolute;inset:11%;border:2px dashed rgba(255,255,255,.75);border-radius:24px;pointer-events:none}
    .status{margin:12px 0;padding:10px;border-radius:10px;background:#1e293b;color:#e2e8f0;font-size:12px;text-align:center}
    .status.ok{background:#052e16;color:#bbf7d0}
    .status.err{background:#450a0a;color:#fecaca}
    .buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    button{border:0;border-radius:11px;padding:13px 10px;font-weight:700;font-size:14px;cursor:pointer}
    #start{background:#2563eb;color:#fff}
    #stop{background:#334155;color:#fff}
    #photo{grid-column:1 / -1;background:#16a34a;color:#fff}
    button:disabled{opacity:.55;cursor:not-allowed}
    .hint{margin-top:12px;font-size:11px;line-height:1.5;color:#94a3b8;text-align:center}
    .toast{
      position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);
      width:min(92vw,420px);padding:14px 18px;border-radius:12px;
      background:#052e16;color:#dcfce7;border:1px solid #22c55e;
      box-shadow:0 14px 35px rgba(0,0,0,.35);font-size:14px;font-weight:700;
      text-align:center;opacity:0;pointer-events:none;transition:.25s ease;z-index:9999
    }
    .toast.show{opacity:1;transform:translate(-50%,0)}
  </style>
</head>
<body>
  <div class="card">
    <h1>Verifikasi Wajah & Kamera</h1>
    <p>SIAL-absenSI digitAL</p>

    <div class="video-wrap">
      <video id="camera" autoplay playsinline muted></video>
      <div class="frame"></div>
    </div>

    <div id="status" class="status">Menyiapkan kamera...</div>

    <div class="buttons">
      <button id="start" type="button">AKTIFKAN KAMERA</button>
      <button id="stop" type="button" disabled>TUTUP KAMERA</button>
      <button id="photo" type="button" disabled>📸 AMBIL FOTO</button>
    </div>

    <div class="hint">Menangkap Kehadiran.</div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  'use strict';

  const video = document.getElementById('camera');
  const statusEl = document.getElementById('status');
  const startBtn = document.getElementById('start');
  const stopBtn = document.getElementById('stop');
  const photoBtn = document.getElementById('photo');
  const toastEl = document.getElementById('toast');
  let stream = null;
  let toastTimer = null;

  function setStatus(text, type){
    statusEl.textContent = text;
    statusEl.className = 'status' + (type === 'ok' ? ' ok' : type === 'err' ? ' err' : '');
  }

  function showToast(message){
    clearTimeout(toastTimer);
    toastEl.textContent = message;
    toastEl.classList.add('show');
    toastTimer = setTimeout(function(){
      toastEl.classList.remove('show');
    }, 2600);
  }

  function notify(type, message){
    try {
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage({ type:type, message:message || '' }, 'https://script.google.com');
        // Beberapa deployment Apps Script menggunakan domain googleusercontent.
        window.opener.postMessage({ type:type, message:message || '' }, '*');
      }
    } catch(e) {}
  }

  async function startCamera(){
    if (stream) {
      setStatus('Kamera sudah aktif.', 'ok');
      return;
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      const msg = 'Browser ini tidak mendukung akses kamera. Gunakan Chrome/Edge/Safari terbaru.';
      setStatus(msg, 'err');
      notify('SIAL_CAMERA_ERROR', msg);
      return;
    }

    try {
      setStatus('Meminta izin kamera...');
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: 'user' },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      });

      video.srcObject = stream;
      await video.play().catch(function(){});
      startBtn.disabled = true;
      stopBtn.disabled = false;
      photoBtn.disabled = false;
      setStatus('Kamera aktif. Arahkan wajah ke dalam bingkai.', 'ok');
      notify('SIAL_CAMERA_STARTED', 'Kamera aktif');
    } catch(err) {
      let msg = 'Kamera tidak dapat diakses.';
      if (err && err.name === 'NotAllowedError') msg = 'Izin kamera ditolak. Izinkan Camera untuk situs ini lalu coba lagi.';
      else if (err && err.name === 'NotFoundError') msg = 'Kamera tidak ditemukan pada perangkat.';
      else if (err && err.name === 'NotReadableError') msg = 'Kamera sedang dipakai aplikasi lain.';
      else if (err && err.name === 'SecurityError') msg = 'Akses kamera ditolak oleh kebijakan keamanan browser.';
      else if (err && err.message) msg += ' ' + err.message;
      setStatus(msg, 'err');
      notify('SIAL_CAMERA_ERROR', msg);
    }
  }

  function stopCamera(){
    if (stream) {
      stream.getTracks().forEach(function(track){ track.stop(); });
      stream = null;
    }
    video.srcObject = null;
    startBtn.disabled = false;
    stopBtn.disabled = true;
    photoBtn.disabled = true;
    setStatus('Kamera sudah ditutup.');
    notify('SIAL_CAMERA_STOPPED', 'Kamera ditutup');
  }

  function capturePhoto(){
    if (!stream || video.readyState < 2 || !video.videoWidth || !video.videoHeight) {
      const msg = 'Kamera belum siap. Silakan tunggu sebentar lalu tekan AMBIL FOTO.';
      setStatus(msg, 'err');
      showToast(msg);
      notify('SIAL_PHOTO_ERROR', msg);
      return;
    }

    // Tangkap satu frame hanya di memori browser.
    // Tidak dibuat link download, tidak disimpan ke localStorage,
    // tidak dikirim ke server, dan langsung dihapus setelah notifikasi.
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d', { willReadFrequently: false });
    if (ctx) {
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
    canvas.width = 0;
    canvas.height = 0;

    setStatus('Foto anda sudah terekam.', 'ok');
    showToast('Foto anda sudah terekam');
    notify('SIAL_PHOTO_CAPTURED', 'Foto anda sudah terekam');
  }

  startBtn.addEventListener('click', startCamera);
  stopBtn.addEventListener('click', stopCamera);
  photoBtn.addEventListener('click', capturePhoto);

  window.addEventListener('message', function(event){
    const d = event.data || {};
    if (d && d.type === 'SIAL_CAMERA_STOP') stopCamera();
  });

  window.addEventListener('beforeunload', function(){
    if (stream) stream.getTracks().forEach(function(track){ track.stop(); });
    notify('SIAL_CAMERA_CLOSED', 'Halaman kamera ditutup');
  });

  // Coba otomatis ketika tab kamera dibuka. Jika browser mewajibkan gesture,
  // pengguna cukup menekan tombol AKTIFKAN KAMERA.
  setTimeout(function(){ startCamera(); }, 350);
})();
</script>
</body>
</html>
