<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SIAL-absenSI digitAL - Kamera</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#0f172a;color:#fff}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
    .card{width:100%;max-width:520px;background:#111827;border:1px solid #334155;border-radius:18px;padding:16px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
    h1{font-size:20px;margin:0 0 5px;text-align:center}
    p{font-size:13px;color:#cbd5e1;text-align:center;margin:0 0 14px}

    /* Preview dibuat stabil di HP portrait. Posisi tengah selalu menjadi titik tengah crop. */
    .video-wrap{
      position:relative;width:100%;aspect-ratio:3/4;background:#020617;
      border-radius:14px;overflow:hidden;border:2px solid #334155;
      display:flex;align-items:center;justify-content:center;
    }
    video{
      width:100%;height:100%;
      object-fit:cover;
      object-position:50% 50%;
      display:block;background:#000;
      /* Balik preview secara horizontal agar tampilan kamera depan tidak mirror. */
      transform:scaleX(-1) !important;
      -webkit-transform:scaleX(-1) !important;
    }

    /* Bingkai berada tepat di tengah preview. */
    .frame{
      position:absolute;
      width:74%;height:74%;
      left:13%;top:13%;
      border:2px dashed rgba(255,255,255,.85);
      border-radius:28px;
      pointer-events:none;
      box-shadow:0 0 0 9999px rgba(0,0,0,.08);
    }
    .frame:before,.frame:after{
      content:"";position:absolute;left:50%;top:50%;
      transform:translate(-50%,-50%);background:rgba(255,255,255,.9);
      border-radius:999px;pointer-events:none;
    }
    .frame:before{width:12px;height:2px}
    .frame:after{width:2px;height:12px}

    .status{margin:12px 0;padding:10px;border-radius:10px;background:#1e293b;color:#e2e8f0;font-size:12px;text-align:center}
    .status.ok{background:#052e16;color:#bbf7d0}
    .status.err{background:#450a0a;color:#fecaca}
    .buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    button{border:0;border-radius:11px;padding:13px 10px;font-weight:700;font-size:14px;cursor:pointer;touch-action:manipulation}
    #start{background:#2563eb;color:#fff}
    #stop{background:#334155;color:#fff}
    #photo{grid-column:1 / -1;background:#16a34a;color:#fff}
    button:disabled{opacity:.55;cursor:not-allowed}
    .hint{margin-top:12px;font-size:11px;line-height:1.5;color:#94a3b8;text-align:center}
    .toast{
      position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);
      width:min(92vw,420px);padding:14px 18px;border-radius:12px;
      background:#052e16;color:#dcfce7;border:1px solid #22c55e;
      box-shadow:0 14px 35px rgba(0,0,0,.35);font-size:14px;font-weight:700;
      text-align:center;opacity:0;pointer-events:none;transition:.25s ease;z-index:9999
    }
    .toast.show{opacity:1;transform:translate(-50%,0)}

    @media (max-width:420px){
      body{padding:10px}
      .card{padding:12px;border-radius:15px}
      .video-wrap{aspect-ratio:3/4}
      .frame{width:76%;height:76%;left:12%;top:12%}
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Verifikasi Wajah &amp; Kamera</h1>
    <p>SIAL-absenSI digitAL</p>

    <div class="video-wrap" id="videoWrap">
      <video id="camera" autoplay playsinline muted></video>
      <div class="frame" aria-hidden="true"></div>
    </div>

    <div id="status" class="status">Menyiapkan kamera...</div>

    <div class="buttons">
      <button id="start" type="button">AKTIFKAN KAMERA</button>
      <button id="stop" type="button" disabled>TUTUP KAMERA</button>
      <button id="photo" type="button" disabled>📸 AMBIL FOTO</button>
    </div>

    <div class="hint">Posisikan wajah di tengah bingkai. Tampilan kamera dan area foto dibuat sama agar lebih presisi.</div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  'use strict';

  const video = document.getElementById('camera');
  const videoWrap = document.getElementById('videoWrap');
  const statusEl = document.getElementById('status');
  const startBtn = document.getElementById('start');
  const stopBtn = document.getElementById('stop');
  const photoBtn = document.getElementById('photo');
  const toastEl = document.getElementById('toast');

  let stream = null;
  let toastTimer = null;
  let autoCloseTimer = null;
  let capturing = false;

  function setStatus(text, type){
    statusEl.textContent = text;
    statusEl.className = 'status' + (type === 'ok' ? ' ok' : type === 'err' ? ' err' : '');
  }

  function showToast(message){
    clearTimeout(toastTimer);
    toastEl.textContent = message;
    toastEl.classList.add('show');
    toastTimer = setTimeout(function(){
      toastEl.classList.remove('show');
    }, 2600);
  }

  function notify(type, message){
    try {
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage({ type:type, message:message || '' }, 'https://script.google.com');
        window.opener.postMessage({ type:type, message:message || '' }, '*');
      }
    } catch(e) {}
  }

  /*
   * Pastikan stream kamera yang berjalan dihentikan sepenuhnya.
   * Elemen video juga dibersihkan agar kamera HP benar-benar dilepas.
   */
  function stopCamera(silent){
    clearTimeout(autoCloseTimer);
    autoCloseTimer = null;

    if (stream) {
      stream.getTracks().forEach(function(track){
        try { track.stop(); } catch(e) {}
      });
      stream = null;
    }

    try { video.pause(); } catch(e) {}
    video.srcObject = null;
    capturing = false;
    startBtn.disabled = false;
    stopBtn.disabled = true;
    photoBtn.disabled = true;

    if (!silent) {
      setStatus('Kamera sudah ditutup.');
      notify('SIAL_CAMERA_STOPPED', 'Kamera ditutup');
    }
  }

  async function startCamera(){
    if (stream) {
      setStatus('Kamera sudah aktif.', 'ok');
      return;
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      const msg = 'Browser ini tidak mendukung akses kamera. Gunakan Chrome/Edge/Safari terbaru.';
      setStatus(msg, 'err');
      notify('SIAL_CAMERA_ERROR', msg);
      return;
    }

    try {
      setStatus('Meminta izin kamera...');

      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: 'user' },
          width: { ideal: 720 },
          height: { ideal: 1280 },
          aspectRatio: { ideal: 0.5625 }
        }
      });

      video.srcObject = stream;
      await video.play().catch(function(){});

      startBtn.disabled = true;
      stopBtn.disabled = false;
      photoBtn.disabled = false;
      setStatus('Kamera aktif. Posisikan wajah tepat di tengah bingkai.', 'ok');
      notify('SIAL_CAMERA_STARTED', 'Kamera aktif');
    } catch(err) {
      stream = null;
      let msg = 'Kamera tidak dapat diakses.';
      if (err && err.name === 'NotAllowedError') msg = 'Izin kamera ditolak. Izinkan Camera untuk situs ini lalu coba lagi.';
      else if (err && err.name === 'NotFoundError') msg = 'Kamera tidak ditemukan pada perangkat.';
      else if (err && err.name === 'NotReadableError') msg = 'Kamera sedang dipakai aplikasi lain.';
      else if (err && err.name === 'SecurityError') msg = 'Akses kamera ditolak oleh kebijakan keamanan browser.';
      else if (err && err.message) msg += ' ' + err.message;
      setStatus(msg, 'err');
      notify('SIAL_CAMERA_ERROR', msg);
    }
  }

  /*
   * Mengambil tepat area yang terlihat oleh pengguna.
   * Karena preview memakai object-fit: cover, canvas menerapkan crop cover
   * yang sama sehingga hasil foto tidak bergeser dari posisi objek di layar.
   */
  function capturePhoto(){
    if (capturing) return;

    if (!stream || video.readyState < 2 || !video.videoWidth || !video.videoHeight) {
      const msg = 'Kamera belum siap. Silakan tunggu sebentar lalu tekan AMBIL FOTO.';
      setStatus(msg, 'err');
      showToast(msg);
      notify('SIAL_PHOTO_ERROR', msg);
      return;
    }

    capturing = true;
    photoBtn.disabled = true;

    const rect = videoWrap.getBoundingClientRect();
    const containerW = Math.max(1, rect.width);
    const containerH = Math.max(1, rect.height);
    const sourceW = video.videoWidth;
    const sourceH = video.videoHeight;

    const scale = Math.max(containerW / sourceW, containerH / sourceH);
    const cropW = containerW / scale;
    const cropH = containerH / scale;
    const cropX = (sourceW - cropW) / 2;
    const cropY = (sourceH - cropH) / 2;

    /* Resolusi hasil mengikuti rasio preview, tetap cukup tajam untuk absensi. */
    const outputW = Math.min(1080, Math.max(720, Math.round(containerW * 2)));
    const outputH = Math.round(outputW * (containerH / containerW));

    const canvas = document.createElement('canvas');
    canvas.width = outputW;
    canvas.height = outputH;

    const ctx = canvas.getContext('2d', { alpha:false, willReadFrequently:false });
    if (ctx) {
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      /* Samakan hasil foto dengan preview yang sudah dibalik agar tidak mirror. */
      ctx.save();
      ctx.translate(outputW, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(
        video,
        cropX, cropY, cropW, cropH,
        0, 0, outputW, outputH
      );
      ctx.restore();

      /* Tetap diproses hanya di memori browser, sama seperti versi sebelumnya. */
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    canvas.width = 0;
    canvas.height = 0;

    setStatus('Foto anda sudah terekam. Kamera akan ditutup otomatis.', 'ok');
    showToast('Foto anda sudah terekam ✓');
    notify('SIAL_PHOTO_CAPTURED', 'Foto anda sudah terekam');

    /* Beri waktu notifikasi tampil sebelum kamera dilepas otomatis. */
    autoCloseTimer = setTimeout(function(){
      stopCamera(true);
      setStatus('Foto berhasil. Kamera sudah ditutup otomatis.', 'ok');
      notify('SIAL_CAMERA_STOPPED', 'Kamera ditutup otomatis setelah foto berhasil');
    }, 700);
  }

  startBtn.addEventListener('click', startCamera);
  stopBtn.addEventListener('click', function(){ stopCamera(false); });
  photoBtn.addEventListener('click', capturePhoto);

  window.addEventListener('message', function(event){
    const d = event.data || {};
    if (d && d.type === 'SIAL_CAMERA_STOP') stopCamera(false);
  });

  window.addEventListener('beforeunload', function(){
    if (stream) {
      stream.getTracks().forEach(function(track){
        try { track.stop(); } catch(e) {}
      });
    }
    notify('SIAL_CAMERA_CLOSED', 'Halaman kamera ditutup');
  });

  /* Coba otomatis ketika halaman kamera dibuka. */
  setTimeout(function(){ startCamera(); }, 350);
})();
</script>
</body>
</html>
